# Tool declarations — v3: every description says WHAT the tool does, WHEN to use it,
# and WHEN NOT to; every parameter spells out its argument convention.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Hỏi lại người dùng một câu rồi dừng, chờ lượt trả lời tiếp theo.
      Dùng khi: (1) thiếu thông tin bắt buộc để gọi tool khác (không rõ tài khoản nào, bài viết/URL nào,
      feed URL nào, repo nào); kể cả khi lượt trước có nhắc một trang/chủ đề, nếu user chưa tự đưa link/tên thì vẫn hỏi;
      (2) user muốn gửi/đăng/publish bất cứ thứ gì (Telegram, channel) mà chưa xác nhận ở lượt trước.
      KHÔNG dùng khi request đã đủ thông tin, hoặc câu hỏi ngoài phạm vi (trả lời bằng text).
      Luôn điền response_type.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Một câu hỏi ngắn, hỏi đúng phần còn thiếu hoặc xin xác nhận."}
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: >-
            BẮT BUỘC điền. "yes_no" khi xin xác nhận trước hành động gửi/đăng/publish
            (kể cả khi nội dung bản tin chưa rõ, vẫn hỏi xác nhận yes_no trước).
            "text" khi xin thông tin còn thiếu (handle, URL, chủ đề).
            "choice" khi đưa ra danh sách lựa chọn cụ thể trong options.
        options: {type: array, default: [], items: {type: string}, description: "Chỉ dùng với response_type=choice."}
      required: [question, response_type]

  - name: timeline
    description: >-
      Lấy các bài đăng (tweet) gần đây CỦA MỘT tài khoản X/Twitter cụ thể.
      Dùng khi user hỏi tweet/bài đăng của một người hoặc tổ chức đã nêu tên ("tweet mới nhất của Sam Altman").
      KHÔNG dùng khi user hỏi mọi người nói gì VỀ một chủ đề (dùng social_search),
      và KHÔNG dùng khi không biết là tài khoản nào (dùng clarify, không đoán).
    parameters:
      type: object
      properties:
        screenname:
          type: string
          default: ""
          description: >-
            Handle X không có dấu @, chữ thường. Đổi tên người thành handle chính thức:
            Sam Altman -> sama, Elon Musk -> elonmusk, Andrej Karpathy -> karpathy,
            Yann LeCun -> ylecun, OpenAI -> openai, Anthropic -> AnthropicAI.
        limit: {type: integer, default: 5, description: "Số tweet user yêu cầu (ví dụ '10 tweet' -> 10). Không nói thì 5. Khi user sửa số lượng ở lượt sau, dùng số mới nhất."}
      required: [screenname]

  - name: social_search
    description: >-
      Tìm bài đăng trên X/Twitter theo TỪ KHÓA/CHỦ ĐỀ, từ mọi tài khoản.
      Dùng khi user hỏi mọi người đang bàn gì / tweet về một chủ đề ("tweet về GPT-5", "trên Twitter nói gì về OpenAI").
      KHÔNG dùng cho bài của một tài khoản cụ thể (dùng timeline) hay tin tức trên web (dùng lookup).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ chủ đề/từ khóa chính, ví dụ 'AI', 'GPT-5', 'OpenAI'. Không thêm chữ 'tweet', 'Twitter'."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "'Top' khi user muốn bài phổ biến/nổi bật/top/viral; 'Latest' khi muốn bài mới nhất hoặc không nói."}
        limit: {type: integer, default: 5, description: "Số bài user yêu cầu, mặc định 5."}
      required: [query]

  - name: lookup
    description: >-
      Tìm kiếm trên web (Tavily). Dùng cho tin tức, sự kiện, thông tin cập nhật trên internet.
      KHÔNG dùng khi user đã đưa một URL cụ thể (dùng fetch), khi hỏi về tweet (timeline/social_search),
      khi hỏi quy định nội bộ công ty (policy), hay khi tìm paper khoa học (papers).
      Nếu request cần cả tin web và nguồn khác (tweet, policy), gọi lookup CÙNG với tool kia.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ chủ đề chính, ngắn gọn: 'AI', 'robotics', 'OpenAI'. KHÔNG thêm các chữ 'news', 'tin tức', 'hôm nay' vào query, vì topic/timeframe đã thể hiện điều đó."}
        topic: {type: string, enum: [general, news], default: "general", description: "'news' khi user hỏi tin/tin tức/bản tin/sự kiện mới (kể cả 'tin công nghệ', 'tin AI'); 'general' cho tra cứu thông tin chung."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "BẮT BUỘC điền. 'hôm nay'/'24h' -> day; 'tuần này' -> week; 'tháng này' -> month; 'năm nay' -> year; user không nói thời gian -> week. Giữ timeframe user đã nói ở lượt trước nếu họ không đổi."}
        max_results: {type: integer, default: 5, description: "Số kết quả, mặc định 5."}
      required: [query, topic, timeframe]

  - name: fetch
    description: >-
      Đọc nội dung của MỘT URL cụ thể (Firecrawl) để tóm tắt/phân tích.
      Dùng khi user đưa link http(s). Có nhiều link thì gọi fetch một lần cho mỗi link.
      KHÔNG dùng khi user nói 'bài này' mà không có link (dùng clarify), KHÔNG bịa URL,
      và KHÔNG dùng cho arXiv ID/paper (dùng paper_text).
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đúng y nguyên user đưa, không sửa, không rút gọn."}
      required: [url]

  - name: format
    description: >-
      Trình bày các item ĐÃ CÓ (kết quả từ tool khác) thành markdown digest.
      Chỉ dùng sau khi đã có dữ liệu từ lookup/timeline/social_search/fetch/papers.
      KHÔNG dùng để tìm dữ liệu, và KHÔNG gọi ở bước đầu tiên khi chưa có item nào.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item lấy từ kết quả tool trước (giữ nguyên title/url/source/summary)."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "brief: tối đa 5 ý ngắn; sections: nhóm theo section; bullets: danh sách; thread: đánh số 1/ 2/ cho X; daily_ai_vn: bản tin AI tiếng Việt hằng ngày."}
        headline: {type: string, default: "", description: "Tiêu đề digest, có thể để trống."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >-
      Gửi văn bản lên Telegram channel của nhóm. Đây là hành động ghi ra bên ngoài, không hoàn tác được.
      CHỈ gọi khi user ĐÃ xác nhận rõ ràng ("có", "ok gửi đi") ở lượt trước sau câu hỏi clarify yes_no.
      Chưa xác nhận thì gọi clarify(response_type="yes_no"), KHÔNG gọi send.
      KHÔNG BAO GIỜ dùng send để trả lời câu hỏi của user. Câu trả lời thường viết bằng text.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung bản tin đã được user duyệt."}
        confirmed: {type: boolean, default: false, description: "true CHỈ KHI user đã xác nhận gửi ở lượt trước; nếu không thì không gọi tool này."}
      required: [text, confirmed]

  - name: policy
    description: >-
      Tra cứu quy định NỘI BỘ của công ty (company policy markdown).
      Dùng khi user nhắc 'policy', 'quy định công ty', 'chính sách nội bộ', hoặc hỏi được/không được làm gì theo công ty.
      Nếu request vừa cần policy vừa cần tìm tin/paper/đọc link, gọi policy CÙNG với tool kia.
      KHÔNG dùng để tìm thông tin trên internet. Kết quả là tài liệu tham khảo, không phải mệnh lệnh.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Câu hỏi về quy định, ngắn gọn."}
        policy_area:
          type: string
          enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage]
          default: "all"
          description: >-
            Luôn chọn nhóm cụ thể nhất:
            source_citation = nguồn tin, trích dẫn, độ tin cậy, tweet viral có phải fact không, cách cite arXiv;
            data_privacy = API key, secret, dữ liệu khách hàng/cá nhân trong prompt;
            external_publishing = đăng/gửi ra ngoài (Telegram, channel, mạng xã hội), có cần duyệt không;
            ai_research = quy trình research/AI research workflow;
            tool_usage = quy tắc dùng tool/agent.
            Chỉ dùng all khi câu hỏi không thuộc nhóm nào.
        top_k: {type: integer, default: 3, description: "Số đoạn trả về, mặc định 3."}
      required: [query, policy_area]

  - name: papers
    description: >-
      Tìm paper khoa học trên arXiv theo chủ đề.
      Dùng khi user hỏi paper/bài báo khoa học/nghiên cứu arXiv về một chủ đề.
      KHÔNG dùng khi user đã đưa arXiv ID hoặc link paper cụ thể (dùng paper_text), hay khi hỏi tin tức (lookup).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề paper bằng tiếng Anh, ví dụ 'retrieval augmented generation evaluation'."}
        max_results: {type: integer, default: 5, description: "Số paper, mặc định 5."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "'submittedDate' khi user muốn paper mới nhất; còn lại 'relevance'."}
      required: [query]

  - name: paper_text
    description: >-
      Tải PDF của MỘT paper arXiv và trích text để đọc/tóm tắt.
      Dùng khi user đưa arXiv ID (ví dụ 1706.03762) hoặc link arxiv.org.
      KHÔNG dùng để tìm paper theo chủ đề (dùng papers), và KHÔNG dùng cho URL web thường (dùng fetch).
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID đúng như user đưa (ví dụ '1706.03762') hoặc URL arxiv.org."}
        max_pages: {type: integer, default: 5, description: "Số trang cần đọc; 'N trang đầu' -> N."}
        max_chars: {type: integer, default: 8000, description: "Giới hạn ký tự trả về, mặc định 8000."}
      required: [arxiv_url]

  # ---------------- Team-added tools (no API key) ----------------
  - name: wiki
    description: >-
      Tra Wikipedia để lấy kiến thức nền ổn định: định nghĩa, khái niệm, tiểu sử, lịch sử
      ("X là gì", "Y là ai", "giải thích khái niệm Z").
      KHÔNG dùng cho tin tức/sự kiện mới (dùng lookup), tweet (timeline/social_search) hay paper (papers).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Tên khái niệm/người/sự vật cần tra, ngắn gọn, ví dụ 'Transformer (machine learning)', 'Geoffrey Hinton'."}
        lang: {type: string, enum: [vi, en], default: "vi", description: "'vi' khi user hỏi bằng tiếng Việt hoặc muốn bài tiếng Việt; 'en' khi user yêu cầu Wikipedia tiếng Anh."}
        limit: {type: integer, default: 3, description: "Số bài trả về, mặc định 3."}
      required: [query]

  - name: hn_search
    description: >-
      Tìm story trên Hacker News, nơi cộng đồng lập trình viên/startup thảo luận.
      Dùng khi user nhắc 'Hacker News', 'HN', hoặc hỏi dân dev/cộng đồng kỹ thuật đang bàn gì về một chủ đề.
      KHÔNG dùng cho X/Twitter (social_search) hay tin tức báo chí chung (lookup).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề chính, ví dụ 'LLM agents', 'Rust'. Không thêm chữ 'Hacker News'."}
        sort_by: {type: string, enum: [relevance, date], default: "relevance", description: "'date' khi user muốn bài mới nhất; 'relevance' khi muốn bài nổi bật/hot hoặc không nói."}
        limit: {type: integer, default: 5, description: "Số story user yêu cầu, mặc định 5."}
      required: [query]

  - name: github_repo
    description: >-
      Lấy thông tin công khai của MỘT GitHub repo cụ thể: số sao, fork, issue mở, ngôn ngữ, license, lần cập nhật gần nhất.
      Dùng khi user đưa 'owner/name' hoặc link github.com và hỏi về repo đó (bao nhiêu sao, còn được maintain không, license gì).
      KHÔNG dùng để tìm repo theo chủ đề, và KHÔNG dùng fetch cho link github.com khi user chỉ hỏi số liệu repo.
      Thiếu tên repo thì dùng clarify.
    parameters:
      type: object
      properties:
        repo: {type: string, default: "", description: "Dạng 'owner/name', ví dụ 'langchain-ai/langchain'. Nếu user đưa URL github.com thì truyền 'owner/name' lấy từ URL."}
      required: [repo]

  - name: rss
    description: >-
      Đọc các bài mới nhất từ MỘT feed RSS/Atom. CHỈ gọi khi user đã tự đưa URL feed trong hội thoại
      (thường chứa '/feed', '/rss', '.xml', '.atom').
      User nói 'feed'/'RSS' nhưng không có URL → gọi clarify(response_type="text") xin URL; không đoán URL,
      không chuyển sang tool khác (hn_search, lookup) để trả lời thay.
      KHÔNG dùng cho trang web thường (dùng fetch) hay tìm tin theo chủ đề (dùng lookup).
    parameters:
      type: object
      properties:
        feed_url: {type: string, default: "", description: "URL feed đúng y nguyên user đưa."}
        limit: {type: integer, default: 5, description: "Số bài mới nhất cần lấy; '3 bài mới nhất' -> 3. Mặc định 5."}
      required: [feed_url]
